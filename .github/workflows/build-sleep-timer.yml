name: Build Tempus Sleep

on:
  push:
    branches: [ main, master, sleep-timer ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Tempus Debug APK
      run: bash gradlew assembleTempusDebug --no-daemon
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: tempus-sleep-debug
        path: app/build/outputs/apk/tempus/debug/*.apk
    
    - name: Build Degoogle Debug APK
      run: bash gradlew assembleDegoogleDebug --no-daemon
    
    - name: Upload Degoogle Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: tempus-sleep-degoogle-debug
        path: app/build/outputs/apk/degoogle/debug/*.apk
